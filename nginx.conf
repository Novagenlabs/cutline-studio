server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation: lets the AI matting worker use SharedArrayBuffer
    # multithreading. credentialless (not require-corp) keeps Google Fonts.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # The AI model is large and immutable per deploy.
    location /models/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ort wasm runtime: .mjs must be served as a JS module.
    location /ort/ {
        types { application/javascript mjs; application/wasm wasm; }
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
